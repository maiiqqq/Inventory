<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8fb; --panel:#ffffff; --panel2:#f1f5f9; --line:#e2e8f0;
    --txt:#0f172a; --mut:#64748b; --faint:#94a3b8;
    --acc:#2563eb; --acc-weak:#dbeafe; --ring:rgba(37,99,235,.25);
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
    --hl:#fef08a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --panel:#111a2e; --panel2:#0f1729; --line:#1e293b;
      --txt:#e5edff; --mut:#94a3b8; --faint:#64748b;
      --acc:#60a5fa; --acc-weak:#16233f; --ring:rgba(96,165,250,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
      --hl:#7c6f1e;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Sarabun',-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- Top bar ---------- */
  .top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .top .inner{max-width:1320px; margin:0 auto; padding:14px 18px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#7c3aed);
    display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:var(--shadow)}
  .brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.2px}
  .brand .sub{font-size:12px; color:var(--mut)}

  /* ---------- Search box ---------- */
  .search{position:relative; display:flex; align-items:center;}
  .search svg.ic{position:absolute; left:16px; width:20px;height:20px; color:var(--faint); pointer-events:none}
  #q{
    width:100%; padding:14px 46px 14px 46px; font-size:16px; font-family:inherit;
    color:var(--txt); background:var(--panel); border:1.5px solid var(--line);
    border-radius:14px; outline:none; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s;
  }
  #q:focus{border-color:var(--acc); box-shadow:0 0 0 4px var(--ring)}
  #q::placeholder{color:var(--faint)}
  .clear{position:absolute; right:10px; border:none; background:var(--panel2); color:var(--mut);
    width:28px;height:28px;border-radius:50%; cursor:pointer; font-size:15px; display:none; line-height:1}
  .clear:hover{color:var(--txt)}

  /* ---------- Category dropdown ---------- */
  .filters{margin-top:18px}
  .selectwrap{position:relative; display:flex; align-items:center; width:100%}
  .fsel{appearance:none; -webkit-appearance:none; width:100%; font-family:inherit; font-size:14.5px;
    color:var(--txt); background:var(--panel); border:1.5px solid var(--line); border-radius:12px;
    padding:12px 42px 12px 42px; outline:none; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s}
  .fsel:hover{border-color:var(--acc)}
  .fsel:focus{border-color:var(--acc); box-shadow:0 0 0 4px var(--ring)}
  .selectwrap .lic{position:absolute; left:14px; width:18px;height:18px; color:var(--faint); pointer-events:none}
  .selectwrap .chev{position:absolute; right:14px; width:16px;height:16px; color:var(--faint); pointer-events:none}

  /* ---------- Body ---------- */
  .wrap{max-width:1320px; margin:0 auto; padding:22px 18px 80px}
  .layout{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start}
  .aside{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:18px; min-width:0}
  .aside h2{font-size:16px; margin:0 0 15px}
  .field-label{display:block; color:var(--mut); font-size:13px; font-weight:600; margin:0 0 8px}
  .aside-note{color:var(--mut); font-size:12px; margin:14px 0 0}
  .main{min-width:0}
  @media(min-width:960px){
    .layout{grid-template-columns:270px minmax(0,1fr)}
    .aside{position:sticky; top:90px}
  }
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 2px 14px; flex-wrap:wrap}
  .count{color:var(--mut); font-size:13px}
  .count b{color:var(--txt)}
  .sort{font-family:inherit; font-size:13px; color:var(--txt); background:var(--panel);
    border:1px solid var(--line); border-radius:9px; padding:7px 10px; outline:none}

  /* ---------- Cards ---------- */
  .grid{display:grid; grid-template-columns:1fr; gap:12px}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px 16px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .12s, border-color .12s}
  .card:hover{transform:translateY(-2px); border-color:var(--acc)}
  .chead{display:flex; align-items:flex-start; gap:10px}
  .num{flex:none; min-width:38px; height:38px; padding:0 8px; border-radius:10px; background:var(--acc-weak);
    color:var(--acc); font-weight:700; font-family:'IBM Plex Mono',monospace; display:grid; place-items:center; font-size:15px}
  .num.pending{font-family:inherit; font-size:11px; color:var(--mut); background:var(--panel2)}
  .titles{flex:1; min-width:0}
  .name{font-weight:700; font-size:16px; word-break:break-word}
  .tag{display:inline-block; margin-top:4px; font-size:11.5px; padding:2px 9px; border-radius:999px;
    background:var(--panel2); color:var(--mut); border:1px solid var(--line)}
  .meta{margin-top:10px; font-size:13px; color:var(--mut); display:flex; flex-direction:column; gap:3px}
  .meta .kv b{color:var(--txt); font-weight:600}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; color:#fff}
  .summary{margin-top:10px; font-size:13.5px; color:var(--txt); opacity:.9;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .foot{margin-top:12px; display:flex; gap:8px; align-items:center}
  .btn{display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-size:13px; font-weight:600;
    color:var(--acc); background:var(--acc-weak); padding:8px 13px; border-radius:10px; transition:filter .12s}
  .btn:hover{filter:brightness(.96)}
  mark{background:var(--hl); color:inherit; padding:0 1px; border-radius:3px}

  /* ---------- states ---------- */
  .empty{text-align:center; color:var(--mut); padding:56px 16px}
  .empty .big{font-size:44px; margin-bottom:8px}
  .diag{max-width:560px; margin:0 auto; text-align:left; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); line-height:1.9}
  .skel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px 16px; box-shadow:var(--shadow)}
  .sk{background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2)); background-size:200% 100%;
    animation:sh 1.2s infinite; border-radius:8px; height:12px; margin:8px 0}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="top">
  <div class="inner">
    <div class="brand">
      <div class="logo">🔎</div>
      <div>
        <h1>ระบบสืบค้นบัญชีคุมสิ่งอุปกรณ์</h1>
        <div class="sub" id="stats">กำลังโหลด…</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="layout">
    <aside class="aside" aria-label="ค้นหาและกรองข้อมูล">
      <h2>ค้นหาและกรอง</h2>
      <label class="field-label" for="q">คำค้นหรือเลขอุปกรณ์</label>
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" autocomplete="off" placeholder="เลข / ชื่อ / หน่วย / โครงการ">
        <button class="clear" id="clear" type="button" aria-label="ล้างคำค้น" title="ล้าง">✕</button>
      </div>
      <div class="filters">
        <label class="field-label" for="cat">หมวดหมู่</label>
        <div class="selectwrap">
          <svg class="lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <select id="cat" class="fsel"><option value="">ทุกหมวดหมู่</option></select>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <p class="aside-note">เลขบนการ์ดอ้างอิงจากบัญชีคุมเท่านั้น รายการที่ยังจับคู่ไม่ได้จะแสดงให้ตรวจสอบ</p>
    </aside>
    <main class="main">
      <div class="bar">
        <div class="count" id="count"></div>
        <select class="sort" id="sort" aria-label="เรียงผลลัพธ์">
          <option value="num">เรียงตามหมายเลข</option>
          <option value="name">เรียงตามชื่อ</option>
          <option value="unit">เรียงตามหน่วย</option>
          <option value="cat">เรียงตามหมวดหมู่</option>
        </select>
      </div>
      <div id="results"></div>
    </main>
  </div>
</div>

<script>
  var CAT='', SORT='num', TIMER=null, SEQ=0;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function safeUrl(s){return /^https:\/\//i.test(String(s||'')) ? esc(s) : '';}
  function hl(s,q){ s=esc(s); if(!q) return s;
    try{var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return s.replace(re,'<mark>$1</mark>');}catch(e){return s;}
  }
  function statusColor(s){ s=s||'';
    if(s.indexOf('อนุมัติ')>=0) return '#16a34a';
    if(s.indexOf('ส่งคืน')>=0) return '#dc2626';
    if(s.indexOf('นำเรียน')>=0) return '#d97706';
    if(s.indexOf('ตรวจสอบ')>=0||s.indexOf('ขอข้อมูล')>=0) return '#0891b2';
    return '#64748b';
  }

  /* ---------- meta ---------- */
  function loadMeta(){
    google.script.run.withSuccessHandler(function(s){
      document.getElementById('stats').textContent = s.total
        ? ('รวม '+s.total+' รายการ • '+s.categories+' หมวดหมู่')
        : 'ยังไม่มีข้อมูลในดัชนี';
      if(!s.total) showDiag();
    }).withFailureHandler(showError).apiStats();

    google.script.run.withSuccessHandler(function(cats){
      var total=cats.reduce(function(a,c){return a+c.count;},0);
      cats.sort(function(a,b){return b.count-a.count;}); // หมวดที่มีมากขึ้นก่อน
      var html='<option value="">ทุกหมวดหมู่ ('+total+')</option>';
      cats.forEach(function(c){
        html+='<option value="'+esc(c.category)+'">'+esc(c.category)+' ('+c.count+')</option>';
      });
      var sel=document.getElementById('cat');
      sel.innerHTML=html;
      sel.value=CAT;
      sel.onchange=function(){ CAT=this.value; doSearch(); };
    }).withFailureHandler(showError).apiCategories();
  }

  /* ---------- search ---------- */
  function currentParams(){
    var q=document.getElementById('q').value.trim();
    var p={q:q, category:CAT, sort:SORT};
    if(/^\d+$/.test(q)){ p.number=q; p.q=''; }
    return p;
  }
  function schedule(){
    var v=document.getElementById('q').value;
    document.getElementById('clear').style.display = v ? 'grid' : 'none';
    clearTimeout(TIMER); TIMER=setTimeout(doSearch, 220);
  }
  function doSearch(){
    var p=currentParams();
    skeleton();
    var my=++SEQ; // กันผลลัพธ์เก่ามาทับผลใหม่ (คำขอเสร็จไม่เรียงลำดับ)
    google.script.run.withSuccessHandler(function(res){
      if(my!==SEQ) return;
      render(res.items, res.total, p.q||'');
    }).withFailureHandler(function(err){ if(my!==SEQ) return; showError(err); }).apiSearch(p);
  }

  function render(list, total, q){
    if(total==null) total=(list?list.length:0);
    var cnt=document.getElementById('count');
    if(!list || !list.length){
      cnt.textContent='';
      document.getElementById('results').innerHTML=
        '<div class="empty"><div class="big">🗂️</div>ไม่พบรายการที่ตรงกับเงื่อนไข<br><span style="font-size:13px">ลองเปลี่ยนคำค้น หรือเลือกหมวด "ทั้งหมด"</span></div>';
      return;
    }
    cnt.innerHTML = (total>list.length)
      ? ('พบ <b>'+total+'</b> รายการ (แสดง '+list.length+' รายการแรก — ค้นให้แคบลงเพื่อดูทั้งหมด)')
      : ('พบ <b>'+list.length+'</b> รายการ');
    var html='<div class="grid">';
    list.forEach(function(r){
      html+='<div class="card">'+
        '<div class="chead">'+
          '<div class="num'+(r.code?'':' pending')+'">'+esc(r.code||'รอตรวจสอบเลข')+'</div>'+
          '<div class="titles">'+
            '<div class="name">'+hl(r.name,q)+'</div>'+
            '<span class="tag">'+esc(r.category)+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="meta">'+
          (r.docNumber && !r.code?'<span class="kv" style="color:#d97706"><b>เลขจาก OCR:</b> '+esc(r.docNumber)+' (ยังไม่ยืนยัน)</span>':'')+
          (r.docNumber && r.code && r.docNumber!==r.number?'<span class="kv" style="color:#d97706"><b>เลขจาก OCR:</b> '+esc(r.docNumber)+' (ต่างจากบัญชีคุม)</span>':'')+
          (r.owner_unit||r.unit?'<span class="kv"><b>หน่วยเจ้าของ:</b> '+hl(r.owner_unit,q)+(r.unit?' • '+esc(r.unit):'')+'</span>':'')+
          (r.project?'<span class="kv"><b>โครงการ:</b> '+hl(r.project,q)+'</span>':'')+
          (r.status?'<span class="kv"><b>สถานะ:</b> <span class="pill" style="background:'+statusColor(r.status)+'">'+esc(r.status)+'</span></span>':'')+
        '</div>'+
        (r.summary?'<div class="summary">'+hl(r.summary,q)+'</div>':'')+
        '<div class="foot">'+
          (safeUrl(r.url)?'<a class="btn" href="'+safeUrl(r.url)+'" target="_blank" rel="noopener noreferrer">📄 เปิดไฟล์ PDF</a>':'')+
        '</div>'+
      '</div>';
    });
    html+='</div>';
    document.getElementById('results').innerHTML=html;
  }

  function skeleton(){
    var one='<div class="skel"><div class="sk" style="width:40%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div>';
    document.getElementById('results').innerHTML='<div class="grid">'+one+one+one+one+'</div>';
  }

  function showError(err){
    document.getElementById('results').innerHTML=
      '<div class="empty"><div class="big">⚠️</div><span style="color:#dc2626">เกิดข้อผิดพลาดจากเซิร์ฟเวอร์</span><br><span style="font-size:13px">'+esc(err && err.message||err)+'</span></div>';
  }

  function showDiag(){
    google.script.run.withSuccessHandler(function(d){
      var msg='';
      if(!d.ledgerExists) msg+='• ไม่พบชีต "บัญชีคุม" (ทะเบียนเลขอุปกรณ์) — ตรวจ LEDGER_SHEET/SPREADSHEET_ID ใน Config.gs<br>';
      if(!d.controlExists) msg+='• ไม่พบชีต "สถานะโครงการ" (ตรวจ CONTROL_SHEET ใน Config.gs)<br>';
      if(!d.hasApiKey) msg+='• ยังไม่ได้ตั้ง OpenRouter API Key → รัน saveApiKey("sk-or-...") หรือใส่ Script Property OPENROUTER_API_KEY<br>';
      if(d.indexRows===0){
        msg+='• ชีต "Index_อุปกรณ์" ยังว่าง ('+d.cacheRows+' ไฟล์ใน cache) → ';
        msg+= d.cacheRows>0 ? 'มี cache แล้ว ให้รัน buildIndex อีกครั้งเพื่อประกอบดัชนี'
                            : 'ยังไม่ได้รัน buildIndex — ไปที่ Apps Script เลือกฟังก์ชัน buildIndex แล้วกด Run (อาจต้องกดซ้ำจนครบ)';
      }
      document.getElementById('results').innerHTML=
        '<div class="empty"><div class="big">📭</div><div class="diag"><b>ยังไม่มีข้อมูลในดัชนี</b><br>'+
        (msg||'ตรวจสอบการรัน buildIndex')+
        '<br><br><span style="color:var(--faint);font-size:12px">สเปรดชีต: '+esc(d.spreadsheetName)+' • cache '+d.cacheRows+' ไฟล์ • index '+d.indexRows+' แถว</span></div></div>';
    }).withFailureHandler(showError).apiDiag();
  }

  /* ---------- wire up ---------- */
  document.getElementById('q').addEventListener('input', schedule);
  document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter'){clearTimeout(TIMER); doSearch();} });
  document.getElementById('clear').onclick=function(){ var q=document.getElementById('q'); q.value=''; q.focus(); schedule(); };
  document.getElementById('sort').onchange=function(){ SORT=this.value; doSearch(); };

  loadMeta();
  doSearch();
  document.getElementById('q').focus();
</script>
</body>
</html>
